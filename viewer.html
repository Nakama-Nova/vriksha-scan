<!doctype html>
<!-- Customer 3D / AR view. Open as viewer.html?model=<url of a published .glb>
     The same <model-viewer> tag drops into any product page. Android opens AR from the .glb directly;
     iPhone needs a .usdz next to it (add ios-src="...usdz") - add that only when iPhone customers ask. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View in 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #f3ece0; font-family: system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: #f3ece0; }
  button[slot="ar-button"] { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border: 0; border-radius: 24px; background: #8c5a2b; color: #fff; font-size: 16px; }
  #msg { padding: 24px; }
</style>
<model-viewer id="mv" camera-controls auto-rotate touch-action="pan-y" shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" loading="lazy">
  <button slot="ar-button">View in your room</button>
</model-viewer>
<div id="msg" hidden>Add ?model=&lt;link to the .glb&gt; to the address.</div>
<script>
  const url = new URLSearchParams(location.search).get("model");
  // only https links to a .glb, so the page cannot be pointed at anything else
  if (url && /^https:\/\/.+\.glb(\?.*)?$/i.test(url)) document.getElementById("mv").src = url;
  else { document.getElementById("mv").hidden = true; document.getElementById("msg").hidden = false; }
</script>
