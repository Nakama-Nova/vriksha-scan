name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # The workshop PC runs Windows, so test there as well as on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      # Syntax errors and undefined names only; style is not enforced here.
      - name: Lint
        run: flake8 . --select=E9,F63,F7,F82 --exclude=.venv

      # test_worker.py runs the whole job with a fake server and a synthetic mesh,
      # so no GPU, COLMAP or ffmpeg is needed. COLMAP itself is not tested here.
      - name: Tests
        run: python -m pytest -q
